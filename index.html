<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flow V20 Online</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/safe.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="app" class="max-w-md mx-auto min-h-screen flex flex-col pb-24 app-container shadow-2xl">
    <!-- HLAVIČKA -->
    <header class="p-5 border-b sticky top-0 z-20 app-container app-header">
        <div class="flex justify-between items-start mb-4">
            <div class="flex items-center gap-3 min-w-0">
                <div class="app-brand-icon-wrap">
                    <img src="https://img.icons8.com/fluency/48/safe.png" class="w-9 h-9" alt="Flow Icon">
                </div>
                <div class="min-w-0">
                    <span id="balance-label" class="text-[10px] font-extrabold uppercase text-emerald-500 tracking-[0.18em]">SPOLU</span>
                    <div id="display-balance" class="text-[2.15rem] leading-none font-extrabold">0,00 €</div>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0">
                <div id="sync-status" onclick="manualSync()" class="sync-pill flex items-center gap-1.5 px-3 py-1.5 rounded-full cursor-pointer">
                    <div id="sync-dot" class="w-2 h-2 bg-emerald-500 rounded-full transition-colors duration-300"></div>
                    <span id="sync-text" class="text-[10px] font-black uppercase tracking-tight">OK</span>
                </div>
                <button type="button" onclick="openChangelogModal()" class="utility-icon-btn w-8 h-8 flex items-center justify-center rounded-full active:scale-95 transition-all">
                    <i data-lucide="info" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <div class="header-divider mb-3"></div>
        <div id="category-summary" class="flex flex-col gap-1.5"></div>
    </header>

    <!-- HLAVNÁ OBRAZOVKA -->
    <main id="screen-home" class="p-4 flex-1">
        <div class="flex flex-col gap-3 mb-4">
            <div class="flex gap-2 items-center">
                <div id="filter-months-container" class="flex-1 flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>
                <select id="filter-year" onchange="renderList()" class="w-[84px] text-[12px] p-2 outline-none h-[36px]"></select>
            </div>

            <div class="flex items-center justify-between gap-2 px-1">
                <div id="ui-toggle" class="toggle-container" onclick="toggleStatusFilter()">
                    <div class="toggle-slider"></div>
                    <div id="opt-unprocessed" class="toggle-option active">Nové</div>
                    <div id="opt-all" class="toggle-option">Všetky</div>
                </div>
                <button id="clear-cat-filter" onclick="resetCategoryFilter()" class="hidden text-[11px] font-extrabold text-amber-500 uppercase tracking-wider">Zrušiť filter X</button>
            </div>

            <div id="active-filter-summary" class="hidden"></div>
            <div id="swipe-hint" class="hidden"></div>
        </div>

        <div id="transaction-list" class="space-y-4"></div>
    </main>

    <!-- OBRAZOVKA GRAFOV -->
    <main id="screen-analytics" class="p-4 flex-1 hidden space-y-4">
        <div class="flex justify-between items-center mb-1">
            <h2 class="text-xl font-extrabold">Grafická analýza</h2>
            <button onclick="saveCurrentPreset()" class="text-[10px] font-extrabold bg-emerald-500/10 text-emerald-500 px-3 py-1.5 rounded-xl border border-emerald-500/20 active:scale-95 transition-all flex items-center gap-1">
                <i data-lucide="bookmark" class="w-3 h-3"></i> U
