name: Flow Mobile ZIP Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flow-mobile-deploy
  cancel-in-progress: false

jobs:
  prepare:
    # Botov vlastný commit už nesmie znova rozbehnúť celý deployment.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    outputs:
      has_zip: ${{ steps.find.outputs.has_zip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: find
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deploy

          ZIP="$(find deploy -maxdepth 1 -type f -name '*.zip' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2- || true)"

          if [ -z "$ZIP" ]; then
            echo "V deploy/ nie je ziadny ZIP."
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Nasiel som: $ZIP"
          echo "has_zip=true" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        if: steps.find.outputs.has_zip == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/flow-release
          mkdir -p /tmp/flow-release

          unzip -q "${{ steps.find.outputs.zip }}" -d /tmp/flow-release

          APP="/tmp/flow-release"

          if [ ! -f "$APP/index.html" ]; then
            FIRST_DIR="$(find "$APP" -mindepth 1 -maxdepth 1 -type d | head -1 || true)"

            if [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/index.html" ]; then
              APP="$FIRST_DIR"
            fi
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Validate package
        if: steps.find.outputs.has_zip == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -f "$APP/index.html" || {
            echo "CHYBA: chyba index.html"
            exit 1
          }

          test -d "$APP/assets" || {
            echo "CHYBA: chyba assets/"
            exit 1
          }

          test -f "$APP/sw.js" || {
            echo "CHYBA: chyba sw.js"
            exit 1
          }

          test -f "$APP/manifest.json" || {
            echo "CHYBA: chyba manifest.json"
            exit 1
          }

          echo "Flow balik je v poriadku."

      - name: Replace application
        if: steps.find.outputs.has_zip == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf assets

          rm -f index.html
          rm -f sw.js
          rm -f manifest.json
          rm -f CHANGELOG.md
          rm -f README.md

          rm -f V2.*-IMPLEMENTACIA.md
          rm -f V2.*-SCENARE.md
          rm -f V2.*-OPRAVY.md

          cp -a "$APP"/. ./

          # ZIP nemoze prepisat GitHub workflow.
          git checkout -- .github 2>/dev/null || true

          # Odstranime iba ZIP.
          rm -f "${{ steps.find.outputs.zip }}"

          # deploy priecinok zostane zachovany.
          mkdir -p deploy
          touch deploy/.gitkeep

      - name: Commit application
        if: steps.find.outputs.has_zip == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Ziadne zmeny."
            exit 0
          fi

          git commit -m "Deploy Flow release"
          git push origin HEAD:main

      - name: Prepare Pages directory
        if: steps.find.outputs.has_zip == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/flow-pages
          mkdir -p /tmp/flow-pages

          cp -a "$APP"/. /tmp/flow-pages/

      - name: Configure Pages
        if: steps.find.outputs.has_zip == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.find.outputs.has_zip == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/flow-pages

  deploy:
    needs: prepare
    if: needs.prepare.outputs.has_zip == 'true'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
