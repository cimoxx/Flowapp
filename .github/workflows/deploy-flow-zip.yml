name: Deploy Flow ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/*.zip'

permissions:
  contents: write

concurrency:
  group: flow-zip-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: pkg
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep '^deploy/.*\.zip$' \
            | tail -1 || true)"

          [ -n "$ZIP" ] || {
            echo "Nenasiel sa novy ZIP v deploy/"
            exit 1
          }

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract and validate
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/flow
          mkdir /tmp/flow

          unzip -q "${{ steps.pkg.outputs.zip }}" -d /tmp/flow

          APP="/tmp/flow"

          if [ ! -f "$APP/index.html" ]; then
            DIR="$(find "$APP" -mindepth 1 -maxdepth 1 -type d | head -1 || true)"

            if [ -n "$DIR" ] && [ -f "$DIR/index.html" ]; then
              APP="$DIR"
            fi
          fi

          test -f "$APP/index.html" || {
            echo "CHYBA: chyba index.html"
            exit 1
          }

          test -d "$APP/assets" || {
            echo "CHYBA: chyba assets/"
            exit 1
          }

          test -f "$APP/sw.js" || {
            echo "CHYBA: chyba sw.js"
            exit 1
          }

          test -f "$APP/manifest.json" || {
            echo "CHYBA: chyba manifest.json"
            exit 1
          }

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Deploy Flow
        shell: bash
        run: |
          set -euo pipefail

          rm -rf assets

          rm -f index.html
          rm -f sw.js
          rm -f manifest.json
          rm -f CHANGELOG.md
          rm -f README.md

          rm -f V2.*-IMPLEMENTACIA.md
          rm -f V2.*-SCENARE.md
          rm -f V2.*-OPRAVY.md

          cp -a "$APP"/. ./

          rm -rf deploy

          git checkout -- .github 2>/dev/null || true

      - name: Commit deployed version
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Ziadne zmeny."
            exit 0
          fi

          PACKAGE="$(basename "${{ steps.pkg.outputs.zip }}")"

          git commit -m "Deploy $PACKAGE"
          git push origin HEAD:main
