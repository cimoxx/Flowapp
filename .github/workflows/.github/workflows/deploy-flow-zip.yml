name: Deploy Flow ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/*.zip'

permissions:
  contents: write

concurrency:
  group: flow-zip-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: pkg
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep '^deploy/.*\.zip$' \
            | tail -1 || true)"

          if [ -z "$ZIP" ]; then
            echo "CHYBA: Nenasiel sa novy ZIP v deploy/"
            exit 1
          fi

          if [ ! -f "$ZIP" ]; then
            echo "CHYBA: ZIP subor neexistuje: $ZIP"
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Pouziva sa balik: $ZIP"

      - name: Extract package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/flow-package
          mkdir -p /tmp/flow-package

          unzip -q "${{ steps.pkg.outputs.zip }}" -d /tmp/flow-package

          APP_ROOT="/tmp/flow-package"

          # Ak je obsah ZIP-u zabaleny este v jednom nadradenom priecinku,
          # najdeme ho automaticky.
          if [ ! -f "$APP_ROOT/index.html" ]; then
            FIRST_DIR="$(find "$APP_ROOT" -mindepth 1 -maxdepth 1 -type d | head -1 || true)"

            if [ -n "$FIRST_DIR" ] && [ -f "$FIRST_DIR/index.html" ]; then
              APP_ROOT="$FIRST_DIR"
            fi
          fi

          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"

      - name: Validate Flow package
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$APP_ROOT/index.html" ]; then
            echo "CHYBA: chyba index.html"
            exit 1
          fi

          if [ ! -d "$APP_ROOT/assets" ]; then
            echo "CHYBA: chyba assets/"
            exit 1
          fi

          if [ ! -f "$APP_ROOT/sw.js" ]; then
            echo "CHYBA: chyba sw.js"
            exit 1
          fi

          if [ ! -f "$APP_ROOT/manifest.json" ]; then
            echo "CHYBA: chyba manifest.json"
            exit 1
          fi

          echo "Balik Flow je v poriadku."

      - name: Replace production frontend
        shell: bash
        run: |
          set -euo pipefail

          echo "Odstranujem staru frontend verziu..."

          rm -rf assets

          rm -f index.html
          rm -f sw.js
          rm -f manifest.json
          rm -f CHANGELOG.md
          rm -f README.md

          rm -f V2.*-IMPLEMENTACIA.md
          rm -f V2.*-SCENARE.md
          rm -f V2.*-OPRAVY.md

          echo "Kopirujem novu verziu..."

          cp -a "$APP_ROOT"/. ./

      - name: Preserve deploy folder
        shell: bash
        run: |
          set -euo pipefail

          # Zmazeme iba ZIP, ktory spustil deployment.
          rm -f "${{ steps.pkg.outputs.zip }}"

          # Priecinok deploy zostane v repozitari.
          mkdir -p deploy
          touch deploy/.gitkeep

      - name: Protect GitHub workflow
        shell: bash
        run: |
          set -euo pipefail

          # Release ZIP nesmie prepisat .github/workflows
          git checkout -- .github 2>/dev/null || true

      - name: Commit deployed version
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Ziadne zmeny na commit."
            exit 0
          fi

          PACKAGE="$(basename "${{ steps.pkg.outputs.zip }}")"

          git commit -m "Deploy $PACKAGE"

          git push origin HEAD:main

          echo "Flow bol nasadeny do main."